services:
  backend:
    build:
      context: .
      args:
        SUMMARIZER_MODEL: ${SUMMARIZER_MODEL:-sshleifer/distilbart-cnn-12-6}
    image: contextual-summarizer-backend
    restart: unless-stopped
    ports:
      - "8791:8000"
    environment:
      SUMMARIZER_MODEL: ${SUMMARIZER_MODEL:-sshleifer/distilbart-cnn-12-6}
      WARMUP_MODEL: "1"
      # int8 weights; set "0" only on a host with RAM to spare.
      QUANTIZE_MODELS: "1"
      TORCH_NUM_THREADS: "1"
      DATABASE_URL: sqlite:////app/data/submissions.db
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173", "https://text-sum.vercel.app"]}
    volumes:
      - ./data:/app/data
    # This droplet also hosts other projects. Uncomment to cap this container so
    # a runaway summary gets it killed instead of its neighbours — check the
    # logged peak first, since too low a cap just moves the OOM kills here.
    # mem_limit: 1500m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
